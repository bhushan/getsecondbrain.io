name: Bug report
description: Something in Second Brain does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Found a security issue? Please do not file it here. Report it privately: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect Claude Code with the MCP address
        2. Ask it to save a note
        3. ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Web app (app.getsecondbrain.io)
        - An AI app through MCP
        - Landing page
        - Self-hosted copy
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: AI app, browser or device
      placeholder: "Claude Code 2.x on macOS, Chrome 140"
  - type: markdown
    attributes:
      value: Please leave out note contents, tokens and personal details.
